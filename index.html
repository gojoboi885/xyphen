<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xyphen</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    :root {
        --background: #000;
        --foreground: #fff;

        --glow-small: rgba(255,255,255,0.5);
        --glow-medium: rgba(255,255,255,0.7);
        --glow-large: rgba(255,255,255,0.35);

        --scanline: rgba(255,255,255,0.025);
    }


    /* =========================================================
       LIGHT THEME
       ========================================================= */

    body.light-theme {

        --background: #fff;
        --foreground: #000;

        --glow-small: rgba(0,0,0,0.45);
        --glow-medium: rgba(0,0,0,0.6);
        --glow-large: rgba(0,0,0,0.25);

        --scanline: rgba(0,0,0,0.025);
    }


    /* =========================================================
       BODY
       ========================================================= */

    html,
    body {
        width: 100%;
        height: 100%;

        overflow: hidden;

        background: var(--background);
        color: var(--foreground);

        font-family: "Share Tech Mono", monospace;

        transition:
            background 0.45s ease,
            color 0.45s ease;
    }


    body {
        position: relative;
    }


    /* =========================================================
       TOP TICKER
       ========================================================= */

    .ticker {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 65px;

        display: flex;
        align-items: center;

        overflow: hidden;
        white-space: nowrap;

        /* Completely invisible header boundary */

        border: none;
        box-shadow: none;

        z-index: 10;
    }


    .ticker-track {
        display: flex;

        width: max-content;

        animation:
            ticker-scroll 28s linear infinite;
    }


    .ticker-content {
        display: flex;
        align-items: center;

        flex-shrink: 0;
    }


    .ticker-item {
        display: inline-block;

        color: var(--foreground);

        font-size: clamp(18px, 2vw, 25px);

        letter-spacing: 2px;

        text-shadow:
            0 0 4px var(--glow-small),
            0 0 10px var(--glow-large);

        transition:
            color 0.45s ease,
            text-shadow 0.45s ease;
    }


    /* =========================================================
       TICKER SEPARATORS
       ========================================================= */

    .ticker-separator {
        display: inline-block;

        margin-left: 32px;
        margin-right: 32px;

        color: var(--foreground);

        font-size: clamp(18px, 2vw, 25px);

        letter-spacing: 2px;

        text-shadow:
            0 0 4px var(--glow-small),
            0 0 10px var(--glow-large);

        transition:
            color 0.45s ease,
            text-shadow 0.45s ease;
    }


    /* =========================================================
       TICKER ANIMATION
       ========================================================= */

    @keyframes ticker-scroll {

        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-50%);
        }

    }


    /* =========================================================
       CENTER CLOCK
       ========================================================= */

    .container {
        position: absolute;

        top: 50%;
        left: 50%;

        transform:
            translate(-50%, -50%);

        width: 100%;

        text-align: center;
    }


    /* =========================================================
       XYphen LOGO
       ========================================================= */

    .logo {
        margin-bottom: 25px;

        color: var(--foreground);

        font-size:
            clamp(45px, 7vw, 100px);

        letter-spacing: 8px;

        text-shadow:
            0 0 5px var(--glow-medium),
            0 0 12px var(--glow-medium),
            0 0 25px var(--glow-large);

        transition:
            color 0.45s ease,
            text-shadow 0.45s ease;
    }


    /* =========================================================
       CLOCK
       ========================================================= */

    #time {
        color: var(--foreground);

        font-size:
            clamp(70px, 13vw, 190px);

        line-height: 0.9;

        letter-spacing: 4px;

        text-shadow:
            0 0 4px var(--glow-medium),
            0 0 12px var(--glow-large);

        transition:
            color 0.45s ease,
            text-shadow 0.45s ease;
    }


    /* =========================================================
       DATE
       ========================================================= */

    #date {
        margin-top: 25px;

        color: var(--foreground);

        font-size:
            clamp(22px, 3vw, 42px);

        letter-spacing: 5px;

        opacity: 0.85;

        text-shadow:
            0 0 4px var(--glow-small),
            0 0 10px var(--glow-large);

        transition:
            color 0.45s ease,
            text-shadow 0.45s ease;
    }


    /* =========================================================
       SIDE THEME ARROWS
       ========================================================= */

    .theme-arrow {
        position: fixed;

        top: 50%;

        transform:
            translateY(-50%);

        width: 70px;
        height: 140px;

        display: flex;

        align-items: center;
        justify-content: center;

        border: none;
        outline: none;

        background: transparent;

        color: var(--foreground);

        font-family:
            "Share Tech Mono",
            monospace;

        font-size: 65px;

        line-height: 1;

        cursor: pointer;

        z-index: 15;

        opacity: 0.65;

        text-shadow:
            0 0 5px var(--glow-small),
            0 0 12px var(--glow-large);

        transition:
            color 0.45s ease,
            opacity 0.2s ease,
            text-shadow 0.45s ease,
            transform 0.15s ease;
    }


    /* =========================================================
       LEFT ARROW
       ========================================================= */

    #leftArrow {
        left: 20px;
    }


    /* =========================================================
       RIGHT ARROW
       ========================================================= */

    #rightArrow {
        right: 20px;
    }


    /* =========================================================
       ARROW HOVER
       ========================================================= */

    .theme-arrow:hover {
        opacity: 0.95;

        text-shadow:
            0 0 6px var(--glow-small),
            0 0 16px var(--glow-large);
    }


    /* =========================================================
       ARROW PRESS
       ========================================================= */

    .theme-arrow:active {

        opacity: 1;

        transform:
            translateY(-50%)
            scale(0.92);
    }


    /* =========================================================
       CRT SCANLINES
       ========================================================= */

    body::after {
        content: "";

        position: fixed;

        inset: 0;

        pointer-events: none;

        background:
            repeating-linear-gradient(
                to bottom,
                var(--scanline) 0px,
                var(--scanline) 1px,
                transparent 1px,
                transparent 4px
            );

        z-index: 20;

        transition:
            background 0.45s ease;
    }


    /* =========================================================
       SMALL SCREENS
       ========================================================= */

    @media (max-width: 600px) {

        .ticker {
            height: 50px;
        }


        .ticker-item,
        .ticker-separator {
            font-size: 16px;
        }


        .ticker-separator {
            margin-left: 22px;
            margin-right: 22px;
        }


        .logo {
            margin-bottom: 20px;

            letter-spacing: 5px;
        }


        #date {
            margin-top: 20px;

            letter-spacing: 3px;
        }


        .theme-arrow {
            width: 45px;
            height: 100px;

            font-size: 45px;
        }


        #leftArrow {
            left: 2px;
        }


        #rightArrow {
            right: 2px;
        }

    }

</style>
</head>


<body>


<!-- =========================================================
     TOP MOVING TICKER
     ========================================================= -->

<div class="ticker">

    <div class="ticker-track">


        <!-- FIRST TICKER SET -->

        <div class="ticker-content">

            <span class="ticker-item">
                xyphen
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="weekday"
            >
                loading
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="weather"
            >
                --°f
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="host"
            >
                host: --
            </span>

            <span class="ticker-separator">
                ///
            </span>

        </div>


        <!-- SECOND TICKER SET
             Used for seamless scrolling -->

        <div class="ticker-content">

            <span class="ticker-item">
                xyphen
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="weekday-copy"
            >
                loading
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="weather-copy"
            >
                --°f
            </span>

            <span class="ticker-separator">
                ///
            </span>


            <span
                class="ticker-item"
                id="host-copy"
            >
                host: --
            </span>

            <span class="ticker-separator">
                ///
            </span>

        </div>

    </div>

</div>


<!-- =========================================================
     THEME ARROWS
     ========================================================= -->

<button
    id="leftArrow"
    class="theme-arrow"
    aria-label="dark theme"
>
    ‹
</button>


<button
    id="rightArrow"
    class="theme-arrow"
    aria-label="light theme"
>
    ›
</button>


<!-- =========================================================
     CENTER CLOCK
     ========================================================= -->

<div class="container">

    <div class="logo">
        //xyphen//
    </div>


    <div id="time">
        00:00:00
    </div>


    <div id="date">
        01/01/26
    </div>

</div>


<script>


    /* =========================================================
       KIOSK CONFIGURATION
       =========================================================

       Change these three values.

       No browser geolocation is used.
       ========================================================= */

    const KIOSK_LATITUDE = 39.0000;

    const KIOSK_LONGITUDE = -86.0000;

    const HOST_IP = "192.168.1.100";


    /* =========================================================
       CLOCK
       ========================================================= */

    function updateClock() {

        const now = new Date();


        /* -------------------------
           TIME
           ------------------------- */

        const hours =
            String(
                now.getHours()
            ).padStart(2, "0");


        const minutes =
            String(
                now.getMinutes()
            ).padStart(2, "0");


        const seconds =
            String(
                now.getSeconds()
            ).padStart(2, "0");


        document.getElementById("time").textContent =
            `${hours}:${minutes}:${seconds}`;


        /* -------------------------
           DATE
           ------------------------- */

        const month =
            String(
                now.getMonth() + 1
            ).padStart(2, "0");


        const day =
            String(
                now.getDate()
            ).padStart(2, "0");


        const year =
            String(
                now.getFullYear()
            ).slice(-2);


        document.getElementById("date").textContent =
            `${month}/${day}/${year}`;


        /* -------------------------
           WEEKDAY
           ------------------------- */

        const weekday =
            now.toLocaleDateString(
                "en-US",
                {
                    weekday: "long"
                }
            ).toLowerCase();


        document.getElementById("weekday").textContent =
            weekday;


        document.getElementById("weekday-copy").textContent =
            weekday;

    }


    /* =========================================================
       WEATHER
       ========================================================= */

    async function updateWeather() {

        const weatherElement =
            document.getElementById("weather");


        const weatherCopyElement =
            document.getElementById("weather-copy");


        try {

            const url =
                `https://api.open-meteo.com/v1/forecast` +
                `?latitude=${KIOSK_LATITUDE}` +
                `&longitude=${KIOSK_LONGITUDE}` +
                `&current=temperature_2m` +
                `&temperature_unit=fahrenheit`;


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "weather request failed"
                );

            }


            const data =
                await response.json();


            const temperature =
                Math.round(
                    data.current.temperature_2m
                );


            const display =
                `${temperature}°f`;


            weatherElement.textContent =
                display;


            weatherCopyElement.textContent =
                display;

        }


        catch (error) {

            console.error(
                "weather error:",
                error
            );


            weatherElement.textContent =
                "--°f";


            weatherCopyElement.textContent =
                "--°f";

        }

    }


    /* =========================================================
       HOST IP
       ========================================================= */

    function updateHost() {

        const display =
            `host: ${HOST_IP}`;


        document.getElementById("host").textContent =
            display;


        document.getElementById("host-copy").textContent =
            display;

    }


    /* =========================================================
       THEME SYSTEM
       ========================================================= */

    const body =
        document.body;


    const leftArrow =
        document.getElementById("leftArrow");


    const rightArrow =
        document.getElementById("rightArrow");


    function setTheme(theme) {

        if (theme === "light") {

            body.classList.add(
                "light-theme"
            );


            localStorage.setItem(
                "xyphen-theme",
                "light"
            );

        }

        else {

            body.classList.remove(
                "light-theme"
            );


            localStorage.setItem(
                "xyphen-theme",
                "dark"
            );

        }

    }


    /* =========================================================
       RIGHT ARROW → WHITE THEME
       ========================================================= */

    rightArrow.addEventListener(
        "click",
        function() {

            setTheme("light");

        }
    );


    /* =========================================================
       LEFT ARROW → BLACK THEME
       ========================================================= */

    leftArrow.addEventListener(
        "click",
        function() {

            setTheme("dark");

        }
    );


    /* =========================================================
       RESTORE SAVED THEME
       ========================================================= */

    const savedTheme =
        localStorage.getItem(
            "xyphen-theme"
        );


    if (savedTheme === "light") {

        setTheme("light");

    }

    else {

        setTheme("dark");

    }


    /* =========================================================
       INITIALIZATION
       ========================================================= */

    updateClock();

    updateWeather();

    updateHost();


    /* Clock:
       update every second */

    setInterval(
        updateClock,
        1000
    );


    /* Weather:
       update every 10 minutes */

    setInterval(
        updateWeather,
        10 * 60 * 1000
    );


</script>

</body>
</html>
